spring.application.name=gestao-frota

#=========================================================================
# ATIVA O PROFILE DEV
# =========================================================================
spring.profiles.active=dev


# =========================================================================
# CONFIGURACAO DO BANCO DE DADOS (POSTGRESQL NEON.TECH)
# =========================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# DRIVER OFICIAL DO POSTGRESQL
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================================
# CONFIGURACAO DO HIBERNATE / JPA
# =========================================================================
# Importante: Como usamos Flyway, desativamos o ddl-auto do Hibernate para ele nao criar tabelas sozinho
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true


# =========================================================================
# CONFIGURACAO DO FLYWAY MIGRATION
# =========================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# =========================================================================
# SEGURANCA / JWT
# =========================================================================
# Chave secreta utilizada pelo TokenService para assinatura e validacao dos tokens JWT
api.security.token.secret=${API_SECURITY_TOKEN_SECRET}

# Variavel que determina o tempo de expiracao do token
api.security.token.expiration-hours=${API_SECURITY_TOKEN_EXPIRATION_HOURS}

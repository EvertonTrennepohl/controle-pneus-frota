spring.application.name=controle-pneus-frota
# =========================================================================
# CONFIGURAÇÃO DO BANCO DE DADOS (POSTGRESQL LOCAL)
# =========================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Driver oficial do PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================================
# CONFIGURAÇÃO DO HIBERNATE / JPA
# =========================================================================
# Importante: Como usamos Flyway, desativamos o ddl-auto do Hibernate para ele n�o criar tabelas sozinho
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================================================
# CONFIGURAÇÃO DO FLYWAY MIGRATION
# =========================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

api.security.token.secret=${API_SECURITY_TOKEN_SECRET}
